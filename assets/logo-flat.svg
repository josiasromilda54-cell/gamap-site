<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <!--
    GAMAP — versão flat (sem metalizado)
    Geometria medida pixel a pixel do original:
    círculo c(316.5,375) R245/r221 · fio vertical x=294 ·
    torres terminam em y=584/566 · arco de 47.8° a 136° com corte em barbatana
  -->
