      <path d="M294 155 A221 221 0 0 0 294 595 Z"/>
    </clipPath>
  </defs>

  <!-- ===== PRÉDIOS AZUIS (topos sobem à direita; fundem com o anel embaixo) ===== -->
  <g clip-path="url(#predios)" fill="#1e74cf">
    <polygon points="138,330 205,272 205,640 138,640"/>
    <polygon points="227,254 294,190 294,640 227,640"/>
  </g>

  <!-- ===== ANEL AZUL: 12h -> 9h -> 6h, cortado no fio vertical x=294 ===== -->
