<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <clipPath id="janela"><circle cx="305" cy="340" r="190"/></clipPath>
  </defs>

  <!-- Anel: metade esquerda (azul) -->
  <path d="M 305 130 A 210 210 0 0 0 305 550" fill="none" stroke="#1e78d0" stroke-width="40"/>
  <!-- Anel: metade direita -->
  <path d="M 305 130 A 210 210 0 0 1 305 550" fill="none" stroke="#3fb0ff" stroke-width="40"/>

  <!-- Prédios ascendentes (esquerda), recortados pela janela circular -->
  <g clip-path="url(#janela)">
    <polygon points="152,338 204,312 204,600 152,600" fill="#155a9e"/>
    <polygon points="222,284 274,256 274,600 222,600" fill="#1e78d0"/>
    <polygon points="290,222 340,194 340,600 290,600" fill="#2f9bff"/>

    <!-- Arranha-céus (direita), recortados pela janela circular -->
    <polygon points="412,140 464,168 464,600 412,600" fill="#2f7fd1"/>
    <polygon points="478,254 522,278 522,600 478,600" fill="#1e5fa8"/>
  </g>

  <!-- Torre principal: fura o topo e passa na frente do anel embaixo -->
  <polygon points="342,42 396,72 396,600 342,600" fill="#3fb0ff"/>
</svg>
