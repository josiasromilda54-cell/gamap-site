<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo — comparativo</title>
<style>
  body { background:#0d1526; color:#e8eef6; font-family:Arial,Helvetica,sans-serif; margin:0; padding:24px; }
  h1 { font-size:18px; text-align:center; margin:0 0 20px; }
  .painel { display:flex; gap:16px; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
  figure { margin:0; background:#ffffff; border-radius:10px; padding:12px; text-align:center; }
  img { width:280px; height:280px; object-fit:contain; display:block; }
  figcaption { margin-top:8px; font-size:13px; color:#0d1526; font-weight:bold; }
</style>
</head>
<body>
  <h1>Comparativo do logo</h1>
  <div class="painel">
    <figure>
      <img src="obras/logo-metalico.jpg?v=1" alt="Original (foto)">
      <figcaption>1. ORIGINAL (foto)</figcaption>
    </figure>
    <figure>
      <img src="logo-metalico.svg?v=1" alt="Vetor metalizado fosco">
      <figcaption>2. VETOR METALIZADO FOSCO</figcaption>
    </figure>
    <figure>
      <img src="logo-flat.svg?v=1" alt="Vetor flat">
      <figcaption>3. VETOR FLAT</figcaption>
    </figure>
  </div>
</body>
</html>
