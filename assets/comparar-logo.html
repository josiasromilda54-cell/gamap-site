<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Comparação do logo</title>
<style>
  body { background: #0d1b2e; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 40px; font-family: sans-serif; }
  .linha { display: flex; gap: 40px; align-items: center; }
  .quadro { text-align: center; color: #9db2c8; font-size: 15px; letter-spacing: 2px; }
  .quadro img { width: 300px; height: 300px; object-fit: contain; background: #0a1420; border-radius: 20px; padding: 10px; }
  .grande img { width: 520px; height: 520px; }
</style></head>
<body>
  <div class="linha">
    <div class="quadro"><img src="obras/logo.jpg"><p>ORIGINAL (metalizado)</p></div>
    <div class="quadro"><img src="logo-flat.svg"><p>VERSÃO FLAT (vetor)</p></div>
  </div>
  <div class="linha grande">
    <div class="quadro"><img src="logo-flat.svg"><p>FLAT EM TAMANHO GRANDE (qualidade infinita)</p></div>
  </div>
</body></html>
